<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아워홈 대시보드 레이아웃</title>
    
    <!-- Toast UI Chart -->
    <link rel="stylesheet" href="https://uicdn.toast.com/chart/latest/toastui-chart.min.css">
    <script src="https://uicdn.toast.com/chart/latest/toastui-chart.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: #E8EAED;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
        }
        
        /* 헤더 */
        .header {
            background: #3B4458;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        
        .header h1 {
            font-size: 28px;
            color: #FFFFFF;
            font-weight: bold;
        }
        
        .header .time {
            font-size: 24px;
            color: #FFFFFF;
        }
        
        /* 메인 컨테이너 */
        .mainList {
            padding: 20px 40px;
            height: calc(1080px - 80px);
        }
        
        /* Gauge Wrap - 3x2 그리드 */
        .gaugeWrap {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 20px;
            height: 100%;
        }
        
        /* Gauge Item - 카드 */
        .gaugeItem {
            background: #FFFFFF;
            border: 3px solid #E7E8EB;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        /* 경고 상태 */
        .gaugeItem.ingWarning {
            background: #FFF5F5;
            border-color: #F05E5E;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(240, 94, 94, 0.4);
            }
            50% {
                box-shadow: 0 0 0 15px rgba(240, 94, 94, 0);
            }
        }
        
        /* 제목 */
        .gaugeItem h2 {
            font-size: 20px;
            color: #56667B;
            font-weight: 600;
            margin-bottom: 10px;
            cursor: pointer;
        }
        
        .gaugeItem.ingWarning h2 {
            color: #F05E5E;
        }
        
        /* 게이지 차트 영역 */
        .chartGauge {
            height: 140px;
            margin: 0 -10px;
        }
        
        /* 큰 숫자 */
        .gaugeTem {
            text-align: center;
            margin: 10px 0;
        }
        
        .gaugeTem em {
            font-size: 44px;
            font-weight: bold;
            color: #2C365C;
            font-style: normal;
        }
        
        .gaugeItem.ingWarning .gaugeTem em {
            color: #F05E5E;
        }
        
        .gaugeTem span {
            font-size: 24px;
            color: #56667B;
            margin-left: 6px;
        }
        
        /* 라인 차트 영역 */
        .chartLine {
            flex: 1;
            min-height: 100px;
            position: relative;
        }
        
        .chartLine canvas {
            width: 100% !important;
            height: 100% !important;
        }
        
        /* 팝업 레이어 */
        .pageLayer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
        }
        
        .pageLayer.active {
            display: block;
        }
        
        .pageMask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
        }
        
        .pageInner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 20px;
            padding: 50px;
            min-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        .pageInner.typeWarning {
            border: 3px solid #F05E5E;
        }
        
        .topBox {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .topBox img {
            width: 48px;
            height: 48px;
            margin-right: 15px;
        }
        
        .topBox h2 {
            font-size: 32px;
            color: #F05E5E;
            font-weight: bold;
        }
        
        .middleBox {
            font-size: 24px;
            color: #2C365C;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <!-- 헤더 -->
    <div class="header">
        <h1>🏭 아워홈 냉장창고 모니터링</h1>
        <div class="time" id="currentTime"></div>
    </div>
    
    <!-- 메인 -->
    <div class="mainList mainGauge">
        <div class="gaugeWrap" id="wrap1">
            
            <!-- 카드 1 -->
            <div class="gaugeItem" id="card1">
                <h2>[2F]냉장창고 도어1 온도</h2>
                <div id="chartArea1" class="chartGauge"></div>
                <div class="gaugeTem"><em id="temp1">3</em><span>℃</span></div>
                <div class="chartLine">
                    <canvas id="lineChart1"></canvas>
                </div>
            </div>
            
            <!-- 카드 2 -->
            <div class="gaugeItem" id="card2">
                <h2>[2F]냉장창고 도어2 온도</h2>
                <div id="chartArea2" class="chartGauge"></div>
                <div class="gaugeTem"><em id="temp2">5</em><span>℃</span></div>
                <div class="chartLine">
                    <canvas id="lineChart2"></canvas>
                </div>
            </div>
            
            <!-- 카드 3 (경고) -->
            <div class="gaugeItem ingWarning" id="card3">
                <h2>[2F]냉장창고 도어3 온도</h2>
                <div id="chartArea3" class="chartGauge"></div>
                <div class="gaugeTem"><em id="temp3">18</em><span>℃</span></div>
                <div class="chartLine">
                    <canvas id="lineChart3"></canvas>
                </div>
            </div>
            
            <!-- 카드 4 -->
            <div class="gaugeItem" id="card4">
                <h2>[3F]냉동창고 도어1 온도</h2>
                <div id="chartArea4" class="chartGauge"></div>
                <div class="gaugeTem"><em id="temp4">-18</em><span>℃</span></div>
                <div class="chartLine">
                    <canvas id="lineChart4"></canvas>
                </div>
            </div>
            
            <!-- 카드 5 -->
            <div class="gaugeItem" id="card5">
                <h2>[3F]냉동창고 도어2 온도</h2>
                <div id="chartArea5" class="chartGauge"></div>
                <div class="gaugeTem"><em id="temp5">-20</em><span>℃</span></div>
                <div class="chartLine">
                    <canvas id="lineChart5"></canvas>
                </div>
            </div>
            
            <!-- 카드 6 -->
            <div class="gaugeItem" id="card6">
                <h2>[3F]냉동창고 도어3 온도</h2>
                <div id="chartArea6" class="chartGauge"></div>
                <div class="gaugeTem"><em id="temp6">-19</em><span>℃</span></div>
                <div class="chartLine">
                    <canvas id="lineChart6"></canvas>
                </div>
            </div>
            
        </div>
    </div>
    
    <!-- 경고 팝업 -->
    <div class="pageLayer" id="warningLayer">
        <div class="pageMask"></div>
        <div class="pageInner typeWarning">
            <div class="topBox">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23F05E5E'%3E%3Cpath d='M12 2L1 21h22L12 2zm0 3.5L19.5 19h-15L12 5.5zM11 10v4h2v-4h-2zm0 6v2h2v-2h-2z'/%3E%3C/svg%3E" alt="경고">
                <h2>온도 한계 초과 경고</h2>
            </div>
            <div class="middleBox">
                [2F]냉장창고 도어3의 온도가<br>
                설정 한계값(15℃)을 초과했습니다.<br><br>
                현재 온도: <strong style="color: #F05E5E;">18℃</strong>
            </div>
        </div>
    </div>
    
    <script>
        // 시계
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('ko-KR', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            const dateStr = now.toLocaleDateString('ko-KR', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                weekday: 'short'
            });
            document.getElementById('currentTime').textContent = `${dateStr} ${timeStr}`;
        }
        updateTime();
        setInterval(updateTime, 1000);
        
        // Toast UI 게이지 차트
        const gaugeData = [
            { id: 1, value: 3, min: 0, max: 15, warning: 12 },
            { id: 2, value: 5, min: 0, max: 15, warning: 12 },
            { id: 3, value: 18, min: 0, max: 20, warning: 15 },
            { id: 4, value: -18, min: -25, max: -10, warning: -15 },
            { id: 5, value: -20, min: -25, max: -10, warning: -15 },
            { id: 6, value: -19, min: -25, max: -10, warning: -15 }
        ];
        
        gaugeData.forEach(item => {
            const isWarning = item.id === 3;
            const color = isWarning ? '#F05E5E' : '#60CB2E';
            
            const chart = toastui.Chart.pieChart({
                el: document.getElementById(`chartArea${item.id}`),
                data: {
                    categories: ['온도'],
                    series: [
                        {
                            name: '현재',
                            data: Math.abs(item.value)
                        },
                        {
                            name: '여유',
                            data: Math.abs(item.max - item.value)
                        }
                    ]
                },
                options: {
                    chart: {
                        width: 'auto',
                        height: 140
                    },
                    series: {
                        dataLabels: {
                            visible: false
                        }
                    },
                    legend: {
                        visible: false
                    },
                    theme: {
                        series: {
                            colors: [color, '#E7E8EB']
                        }
                    }
                }
            });
        });
        
        // Chart.js 라인 차트
        function createLineChart(canvasId, temp, isWarning) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            
            // 더미 데이터 생성
            const hours = [];
            const temps = [];
            for (let i = 11; i >= 0; i--) {
                hours.push(`${23 - i}:00`);
                const variance = (Math.random() - 0.5) * 2;
                temps.push(temp + variance);
            }
            
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: hours,
                    datasets: [{
                        data: temps,
                        borderColor: isWarning ? '#F05E5E' : '#1b59f8',
                        backgroundColor: isWarning ? 'rgba(240, 94, 94, 0.1)' : 'rgba(27, 89, 248, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        pointHoverRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false
                        }
                    },
                    scales: {
                        x: {
                            display: true,
                            grid: {
                                display: false
                            },
                            ticks: {
                                font: {
                                    size: 10
                                },
                                maxRotation: 0
                            }
                        },
                        y: {
                            display: true,
                            grid: {
                                color: '#f0f0f0'
                            },
                            ticks: {
                                font: {
                                    size: 10
                                }
                            }
                        }
                    }
                }
            });
        }
        
        // 각 카드에 라인 차트 생성
        createLineChart('lineChart1', 3, false);
        createLineChart('lineChart2', 5, false);
        createLineChart('lineChart3', 18, true);
        createLineChart('lineChart4', -18, false);
        createLineChart('lineChart5', -20, false);
        createLineChart('lineChart6', -19, false);
        
        // 경고 팝업 자동 표시 (5초 후)
        setTimeout(() => {
            document.getElementById('warningLayer').classList.add('active');
            
            // 10초 후 자동 닫기
            setTimeout(() => {
                document.getElementById('warningLayer').classList.remove('active');
            }, 10000);
        }, 5000);
        
        // 팝업 클릭시 닫기
        document.querySelector('.pageMask')?.addEventListener('click', () => {
            document.getElementById('warningLayer').classList.remove('active');
        });
    </script>
</body>
</html>
