<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카드6 레이아웃 10종 비교</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: #E8EAED;
            padding: 20px;
        }
        
        /* 컨트롤 패널 */
        .control-panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .control-panel h1 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #3B4458;
        }
        
        .layout-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .layout-btn {
            padding: 10px 20px;
            background: #E8EAED;
            border: 2px solid #9CA3AF;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .layout-btn:hover {
            background: #D1D5DB;
        }
        
        .layout-btn.active {
            background: #3B4458;
            color: white;
            border-color: #3B4458;
        }
        
        /* 카드6 컨테이너 */
        .card6-container {
            width: 760px;
            height: 980px;
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            margin: 0 auto;
        }
        
        .card6-title {
            font-size: 26px;
            color: #3B4458;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .card6-content {
            height: calc(100% - 50px);
        }
        
        /* 공통 섹션 스타일 */
        .section {
            background: #F9FAFB;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #4B5563;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .section-value {
            font-size: 24px;
            font-weight: 700;
            color: #1F2937;
        }
        
        .section-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .item-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #6B7280;
            padding: 6px 0;
            border-bottom: 1px solid #E5E7EB;
        }
        
        .item-row:last-child {
            border-bottom: none;
        }
        
        /* 선입선출 위반 강조 */
        .section-fifo {
            background: #FEE2E2;
            border: 3px solid #EF4444;
            animation: pulse-fifo 2s infinite;
        }
        
        .section-fifo .section-title {
            color: #DC2626;
        }
        
        @keyframes pulse-fifo {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
            }
        }
        
        /* Layout 1: 세로 배치 */
        .layout-1 .card6-content {
            display: flex;
            flex-direction: column;
        }
        
        .layout-1 .section {
            flex: 1;
        }
        
        .layout-1 .section-fifo {
            flex: 1.5;
        }
        
        .layout-1 .section-compact {
            display: flex;
            gap: 10px;
        }
        
        .layout-1 .section-compact > div {
            flex: 1;
            padding: 10px;
        }
        
        /* Layout 2: 2열 분할 (선입선출 좌측 강조) */
        .layout-2 .card6-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
        }
        
        .layout-2 .section-fifo {
            grid-row: 1 / 3;
        }
        
        /* Layout 3: 그리드 3x2 */
        .layout-3 .card6-content {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 12px;
        }
        
        /* Layout 4: 선입선출 최상단 고정 + 나머지 2x2 */
        .layout-4 .card6-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 2fr 1fr 1fr 1fr;
            gap: 12px;
        }
        
        .layout-4 .section-fifo {
            grid-column: 1 / 3;
        }
        
        .layout-4 .section-6 {
            grid-column: 1 / 3;
        }
        
        /* Layout 5: 균등 배치 2x3 */
        .layout-5 .card6-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
        }
        
        /* Layout 6: 카드형 (6개 작은 카드) */
        .layout-6 .card6-content {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 15px;
        }
        
        .layout-6 .section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        /* Layout 7: 리스트형 (라인으로 구분) */
        .layout-7 .card6-content {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        
        .layout-7 .section {
            border-radius: 0;
            background: transparent;
            border-bottom: 3px solid #E5E7EB;
            padding: 18px 10px;
            margin: 0;
        }
        
        .layout-7 .section:last-child {
            border-bottom: none;
        }
        
        .layout-7 .section-title {
            font-size: 16px;
            margin-bottom: 5px;
        }
        
        .layout-7 .section-value {
            font-size: 20px;
        }
        
        /* Layout 8: 선입선출 상단 + 3열 하단 */
        .layout-8 .card6-content {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 2fr 1fr 1fr;
            gap: 12px;
        }
        
        .layout-8 .section-fifo {
            grid-column: 1 / 4;
        }
        
        /* Layout 9: 중요 정보 좌측, 일반 정보 우측 */
        .layout-9 .card6-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 2fr 1fr 1fr;
            gap: 12px;
        }
        
        .layout-9 .section-fifo {
            grid-row: 1 / 2;
        }
        
        .layout-9 .section-4,
        .layout-9 .section-5,
        .layout-9 .section-6 {
            grid-column: 2;
        }
        
        /* Layout 10: 컴팩트 믹스형 */
        .layout-10 .card6-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto 1fr 1fr;
            gap: 12px;
        }
        
        .layout-10 .section-top-compact {
            grid-column: 1 / 3;
            display: flex;
            gap: 10px;
        }
        
        .layout-10 .section-top-compact > div {
            flex: 1;
        }
        
        .layout-10 .section-6 {
            grid-column: 1 / 3;
        }
    </style>
</head>

        <h1>📦 카드6 레이아웃 10종 비교</h1>
        <p style="margin-bottom: 15px; color: #6B7280;">
            클릭해서 다양한 레이아웃을 비교해보세요. (760px × 980px)
        </p>
        <div class="layout-buttons">
            <button class="layout-btn active" onclick="switchLayout(1)">Layout 1</button>
            <button class="layout-btn" onclick="switchLayout(2)">Layout 2</button>
            <button class="layout-btn" onclick="switchLayout(3)">Layout 3</button>
            <button class="layout-btn" onclick="switchLayout(4)">Layout 4</button>
            <button class="layout-btn" onclick="switchLayout(5)">Layout 5</button>
            <button class="layout-btn" onclick="switchLayout(6)">Layout 6</button>
            <button class="layout-btn" onclick="switchLayout(7)">Layout 7</button>
            <button class="layout-btn" onclick="switchLayout(8)">Layout 8</button>
            <button class="layout-btn" onclick="switchLayout(9)">Layout 9</button>
            <button class="layout-btn" onclick="switchLayout(10)">Layout 10</button>
        </div>
    </div>
    
    <!-- 카드6 컨테이너 -->
    <div class="card6-container layout-1" id="card6">
        <h2 class="card6-title">📦 금일 재고 현황</h2>
        <div class="card6-content" id="card6Content">
            <!-- JavaScript로 동적 생성 -->
        </div>
    </div>
    
    <script>
        // 전역 데이터 (JSON 직접 임베드)
        const sampleData = {
            "generated_at": "2025-11-25T13:56:09.041247",
            "source_files": ["outbound_all_20251116.csv", "outbound_all_20251119.csv"],
            "sections": {
                "section1_fifo_violation": [

                    {"location": "C-03-02-01", "product": "간장소스우불고기", "expiry": "2025-12-08"}
                ],
                "section2_total_inventory": {"total_value": 17680000},
                "section3_storage_rate": {"rate": 45.2},
                "section4_special_delivery": [
                    {"name": "(EE)이랜드_CJ이천(과세)", "count": 778},
                    {"name": "프레시_쿠팡(곤지암1)직매입", "count": 2},
                    {"name": "프레시_쿠팡(YAN4)직매입", "count": 2}
                ],
                "section5_delete_status": {
                    "ansan": [
                        {"name": "닭가슴살채", "unit": "EA", "count": 2},
                        {"name": "보쌈수소스", "unit": "PK", "count": 3},
                        {"name": "간장소스우불고기", "unit": "EA", "count": 1}
                    ],
                    "eumseong": [
                        {"name": "프레시쿠팡용", "unit": "BOX", "count": 5},
                        {"name": "이랜드용", "unit": "EA", "count": 2}
                    ]
                },
                "section6_partial_shipment": [
                    {"delivery_group": "4331", "delivery_name": "용인2", "product_name": "(캘리)참깨소스(2kg) 캘리스코", "qty_before": 4, "qty_after": 2},
                    {"delivery_group": "1114", "delivery_name": "사보텐건대스타시티점", "product_name": "(캘리)우동소스 캘리스코", "qty_before": 2, "qty_after": 1},
                    {"delivery_group": "2209", "delivery_name": "사보텐교대역점", "product_name": "(캘리)우동소스 캘리스코", "qty_before": 2, "qty_after": 1},
                    {"delivery_group": "2201", "delivery_name": "히바린 IFC몰", "product_name": "(캘리)돈카츠소스(2kg) 캘리스코", "qty_before": 3, "qty_after": 2},
                    {"delivery_group": "2201", "delivery_name": "히바린 IFC몰", "product_name": "(캘리)참깨소스(2kg) 캘리스코", "qty_before": 3, "qty_after": 2},
                    {"delivery_group": "2203", "delivery_name": "히바린 타임스퀘어점", "product_name": "(캘리)돈카츠소스(2kg) 캘리스코", "qty_before": 3, "qty_after": 2},
                    {"delivery_group": "2211", "delivery_name": "사보텐이마트남양주점", "product_name": "(캘리)돈카츠소스(2kg) 캘리스코", "qty_before": 2, "qty_after": 1},
                    {"delivery_group": "4407", "delivery_name": "더사보텐스타필드애비뉴점", "product_name": "(캘리)돈카츠소스(2kg) 캘리스코", "qty_before": 5, "qty_after": 2},
                    {"delivery_group": "4407", "delivery_name": "더사보텐스타필드애비뉴점", "product_name": "(캘리)참깨소스(2kg) 캘리스코", "qty_before": 3, "qty_after": 1},
                    {"delivery_group": "3322", "delivery_name": "엘엑스세미콘강남점", "product_name": "우동소스Ⅱ(R) 행복한맛남", "qty_before": 2, "qty_after": 1}
                ]
            }
        };
        
        let currentLayout = 1;
        
        // 초기화 함수
        function init() {
            console.log('✅ 데이터 로드 완료:', sampleData);
            renderLayout(currentLayout);
        }
        
        // 레이아웃 전환
        function switchLayout(layoutNum) {
            currentLayout = layoutNum;
            
            // 버튼 활성화 상태 변경
            document.querySelectorAll('.layout-btn').forEach((btn, idx) => {
                if (idx + 1 === layoutNum) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            // 카드6 클래스 변경
            const card6 = document.getElementById('card6');
            card6.className = `card6-container layout-${layoutNum}`;
            
            // 레이아웃 재렌더링
            renderLayout(layoutNum);
        }
        
        // 레이아웃 렌더링
        function renderLayout(layoutNum) {
            const container = document.getElementById('card6Content');
            container.innerHTML = '';
            
            // 각 레이아웃별 HTML 생성
            switch(layoutNum) {
                case 1:
                    renderLayout1(container);
                    break;
                case 2:
                    renderLayout2(container);
                    break;
                case 3:
                    renderLayout3(container);
                    break;
                case 4:
                    renderLayout4(container);
                    break;
                case 5:
                    renderLayout5(container);
                    break;
                case 6:
                    renderLayout6(container);
                    break;
                case 7:
                    renderLayout7(container);
                    break;
                case 8:
                    renderLayout8(container);
                    break;
                case 9:
                    renderLayout9(container);
                    break;
                case 10:
                    renderLayout10(container);
                    break;
            }
        }
        
        // Layout 1: 세로 배치 + 하단 컴팩트
        function renderLayout1(container) {
            const sections = sampleData.sections;
            
            container.innerHTML = `
                ${renderFifoSection(sections.section1_fifo_violation)}
                ${renderTotalInventory(sections.section2_total_inventory)}
                ${renderStorageRate(sections.section3_storage_rate)}
                <div class="section-compact">
                    ${renderSpecialDelivery(sections.section4_special_delivery)}
                    ${renderDeleteStatus(sections.section5_delete_status)}
                    ${renderPartialShipment(sections.section6_partial_shipment)}
                </div>
            `;
        }
        
        // Layout 2: 2열 분할 (선입선출 좌측 강조)
        function renderLayout2(container) {
            const sections = sampleData.sections;
            
            container.innerHTML = `
                ${renderFifoSection(sections.section1_fifo_violation)}
                ${renderTotalInventory(sections.section2_total_inventory)}
                ${renderStorageRate(sections.section3_storage_rate)}
                ${renderSpecialDelivery(sections.section4_special_delivery)}
                ${renderDeleteStatus(sections.section5_delete_status)}
                ${renderPartialShipment(sections.section6_partial_shipment)}
            `;
        }
        
        // Layout 3: 그리드 3x2
        function renderLayout3(container) {
            const sections = sampleData.sections;
            
            container.innerHTML = `
                ${renderFifoSection(sections.section1_fifo_violation)}
                ${renderTotalInventory(sections.section2_total_inventory)}
                ${renderStorageRate(sections.section3_storage_rate)}
                ${renderSpecialDelivery(sections.section4_special_delivery)}
                ${renderDeleteStatus(sections.section5_delete_status)}
                ${renderPartialShipment(sections.section6_partial_shipment)}
            `;
        }
        
        // Layout 4: 선입선출 최상단 + 2x2 + 하단 미출
        function renderLayout4(container) {
            const sections = sampleData.sections;
            
            container.innerHTML = `
                ${renderFifoSection(sections.section1_fifo_violation)}
                ${renderTotalInventory(sections.section2_total_inventory)}
                ${renderStorageRate(sections.section3_storage_rate)}
                ${renderSpecialDelivery(sections.section4_special_delivery)}
                ${renderDeleteStatus(sections.section5_delete_status)}
                ${renderPartialShipment(sections.section6_partial_shipment, 'section-6')}
            `;
        }
        
        // Layout 5: 균등 배치 2x3
        function renderLayout5(container) {
            const sections = sampleData.sections;
            
            container.innerHTML = `
                ${renderFifoSection(sections.section1_fifo_violation)}
                ${renderTotalInventory(sections.section2_total_inventory)}
                ${renderStorageRate(sections.section3_storage_rate)}
                ${renderSpecialDelivery(sections.section4_special_delivery)}
                ${renderDeleteStatus(sections.section5_delete_status)}
                ${renderPartialShipment(sections.section6_partial_shipment)}
            `;
        }
        
        // Layout 6: 카드형 (6개 작은 카드)
        function renderLayout6(container) {
            const sections = sampleData.sections;
            
            container.innerHTML = `
                ${renderFifoSection(sections.section1_fifo_violation)}
                ${renderTotalInventory(sections.section2_total_inventory)}
                ${renderStorageRate(sections.section3_storage_rate)}
                ${renderSpecialDelivery(sections.section4_special_delivery)}
                ${renderDeleteStatus(sections.section5_delete_status)}
                ${renderPartialShipment(sections.section6_partial_shipment)}
            `;
        }
        
        // Layout 7: 리스트형 (라인으로 구분)
        function renderLayout7(container) {
            const sections = sampleData.sections;
            
            container.innerHTML = `
                ${renderFifoSection(sections.section1_fifo_violation)}
                ${renderTotalInventory(sections.section2_total_inventory)}
                ${renderStorageRate(sections.section3_storage_rate)}
                ${renderSpecialDelivery(sections.section4_special_delivery)}
                ${renderDeleteStatus(sections.section5_delete_status)}
                ${renderPartialShipment(sections.section6_partial_shipment)}
            `;
        }
        
        // Layout 8: 선입선출 상단 + 3열 하단
        function renderLayout8(container) {
            const sections = sampleData.sections;
            
            container.innerHTML = `
                ${renderFifoSection(sections.section1_fifo_violation)}
                ${renderTotalInventory(sections.section2_total_inventory)}
                ${renderStorageRate(sections.section3_storage_rate)}
                ${renderSpecialDelivery(sections.section4_special_delivery)}
                ${renderDeleteStatus(sections.section5_delete_status)}
                ${renderPartialShipment(sections.section6_partial_shipment)}
            `;
        }
        
        // Layout 9: 중요 정보 좌측, 일반 정보 우측
        function renderLayout9(container) {
            const sections = sampleData.sections;
            
            container.innerHTML = `
                ${renderFifoSection(sections.section1_fifo_violation)}
                ${renderTotalInventory(sections.section2_total_inventory)}
                ${renderStorageRate(sections.section3_storage_rate)}
                ${renderSpecialDelivery(sections.section4_special_delivery, 'section-4')}
                ${renderDeleteStatus(sections.section5_delete_status, 'section-5')}
                ${renderPartialShipment(sections.section6_partial_shipment, 'section-6')}
            `;
        }
        
        // Layout 10: 컴팩트 믹스형
        function renderLayout10(container) {
            const sections = sampleData.sections;
            
            container.innerHTML = `
                <div class="section-top-compact">
                    ${renderFifoSection(sections.section1_fifo_violation)}
                    ${renderTotalInventory(sections.section2_total_inventory)}
                </div>
                ${renderStorageRate(sections.section3_storage_rate)}
                ${renderSpecialDelivery(sections.section4_special_delivery)}
                ${renderDeleteStatus(sections.section5_delete_status)}
                ${renderPartialShipment(sections.section6_partial_shipment, 'section-6')}
            `;
        }
        
        // 섹션1: 선입선출 위반
        function renderFifoSection(data) {
            if (!data || data.length === 0) {
                return `
                    <div class="section section-fifo">
                        <div class="section-title">⚠️ 선입선출 위반</div>
                        <div class="section-value" style="color: #10B981;">✅ 정상</div>
                    </div>
                `;
            }
            
            const items = data.map(item => `
                <div class="item-row">
                    <span>${item.location}</span>
                    <span>${item.product}</span>
                    <span style="color: #DC2626; font-weight: 600;">${item.expiry}</span>
                </div>
            `).join('');
            
            return `
                <div class="section section-fifo">
                    <div class="section-title">⚠️ 선입선출 위반 (${data.length}건)</div>
                    <div class="section-items">${items}</div>
                </div>
            `;
        }
        
        // 섹션2: 총 재고
        function renderTotalInventory(data) {
            const formatted = data.total_value.toLocaleString('ko-KR');
            return `
                <div class="section">
                    <div class="section-title">💰 총 재고</div>
                    <div class="section-value">${formatted} 원</div>
                </div>
            `;
        }
        
        // 섹션3: 상단 파레트 적치율
        function renderStorageRate(data) {
            return `
                <div class="section">
                    <div class="section-title">📊 상단 파레트 적치율</div>
                    <div class="section-value">${data.rate}%</div>
                </div>
            `;
        }
        
        // 섹션4: 금일 특판 출하
        function renderSpecialDelivery(data, customClass = '') {
            if (!data || data.length === 0) {
                return `
                    <div class="section ${customClass}">
                        <div class="section-title">🚛 금일 특판 출하</div>
                        <div class="section-value">출하 없음</div>
                    </div>
                `;
            }
            
            const items = data.map(item => `
                <div class="item-row">
                    <span>${item.name.substring(0, 20)}${item.name.length > 20 ? '...' : ''}</span>
                    <span style="font-weight: 600;">${item.count}건</span>
                </div>
            `).join('');
            
            return `
                <div class="section ${customClass}">
                    <div class="section-title">🚛 금일 특판 출하</div>
                    <div class="section-items">${items}</div>
                </div>
            `;
        }
        
        // 섹션5: 금일 삭제 현황
        function renderDeleteStatus(data, customClass = '') {
            const ansanItems = data.ansan.map(item => `
                <div class="item-row">
                    <span>${item.name}</span>
                    <span>${item.unit}</span>
                    <span style="font-weight: 600;">${item.count}개</span>
                </div>
            `).join('');
            
            const eumseongItems = data.eumseong.map(item => `
                <div class="item-row">
                    <span>${item.name}</span>
                    <span>${item.unit}</span>
                    <span style="font-weight: 600;">${item.count}개</span>
                </div>
            `).join('');
            
            return `
                <div class="section ${customClass}">
                    <div class="section-title">🗑️ 금일 삭제 현황</div>
                    <div style="font-size: 14px; color: #6B7280; margin-bottom: 8px; font-weight: 600;">안산 (${data.ansan.length}건)</div>
                    <div class="section-items">${ansanItems}</div>
                    <div style="font-size: 14px; color: #6B7280; margin: 12px 0 8px 0; font-weight: 600;">음성 (${data.eumseong.length}건)</div>
                    <div class="section-items">${eumseongItems}</div>
                </div>
            `;
        }
        
        // 섹션6: 미출/부분출고 내역
        function renderPartialShipment(data, customClass = '') {
            if (!data || data.length === 0) {
                return `
                    <div class="section ${customClass}">
                        <div class="section-title">🔔 미출/부분출고</div>
                        <div class="section-value">내역 없음</div>
                    </div>
                `;
            }
            
            const items = data.slice(0, 5).map(item => `
                <div class="item-row" style="font-size: 13px;">
                    <span>${item.delivery_group} | ${item.delivery_name}</span>
                    <span>${item.product_name.substring(0, 15)}${item.product_name.length > 15 ? '...' : ''}</span>
                    <span style="color: #DC2626; font-weight: 600;">${item.qty_before} → ${item.qty_after}</span>
                </div>
            `).join('');
            
            return `
                <div class="section ${customClass}">
                    <div class="section-title">🔔 미출/부분출고 (${data.length}건)</div>
                    <div class="section-items">${items}</div>
                    ${data.length > 5 ? `<div style="text-align: center; margin-top: 8px; color: #9CA3AF; font-size: 12px;">외 ${data.length - 5}건</div>` : ''}
                </div>
            `;
        }
        
        // 페이지 로드 시 초기화
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
