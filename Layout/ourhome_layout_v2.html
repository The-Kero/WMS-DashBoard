<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아워홈 대시보드 레이아웃 v2</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: #E8EAED;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
        }
        
        /* 헤더 */
        .header {
            background: #3B4458;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        
        .header h1 {
            font-size: 24px;
            color: #FFFFFF;
            font-weight: bold;
        }
        
        .header .time {
            font-size: 20px;
            color: #FFFFFF;
        }
        
        /* 메인 컨테이너 */
        .mainList {
            padding: 20px;
            height: calc(1080px - 60px);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        /* 상단 4개 그리드 */
        .topRow {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            height: 48%;
        }
        
        /* 하단 2개 그리드 */
        .bottomRow {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            height: 48%;
        }
        
        /* 카드 */
        .gaugeItem {
            background: #FFFFFF;
            border: 2px solid #D1D5DB;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        /* 경고 상태 */
        .gaugeItem.ingWarning {
            background: #FFF5F5;
            border-color: #F05E5E;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(240, 94, 94, 0.4);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(240, 94, 94, 0);
            }
        }
        
        /* 제목 */
        .gaugeItem h2 {
            font-size: 18px;
            color: #4B5563;
            font-weight: 600;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .gaugeItem.ingWarning h2 {
            color: #F05E5E;
        }
        
        /* 게이지 차트 영역 */
        .chartGauge {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 150px;
        }
        
        /* 온도 표시 (°C만) */
        .tempUnit {
            text-align: center;
            font-size: 20px;
            color: #9CA3AF;
            margin: 10px 0;
        }
        
        /* 라인 차트 영역 (매우 단순) */
        .chartLine {
            height: 80px;
            position: relative;
            border-left: 2px solid #E5E7EB;
            padding-left: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .chartLine .yAxis {
            font-size: 11px;
            color: #9CA3AF;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }
        
        /* 하단 DOOR/CLOSE 바 */
        .doorBar {
            background: #5B7DBF;
            height: 60px;
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0 0 8px 8px;
            position: relative;
            margin: -20px -20px -20px -20px;
        }
        
        .doorBar .doorIndicator {
            width: 100px;
            height: 100px;
            background: #4A6BAE;
            border-radius: 50%;
            position: absolute;
            top: -40px;
            border: 5px solid #FFFFFF;
        }
        
        .doorBar .doorText {
            font-size: 16px;
            color: #9CA3AF;
            font-weight: 600;
            position: absolute;
        }
        
        .doorBar .doorText.left {
            left: 30px;
        }
        
        .doorBar .doorText.right {
            right: 30px;
        }
        
        /* 팝업 레이어 */
        .pageLayer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
        }
        
        .pageLayer.active {
            display: block;
        }
        
        .pageMask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
        }
        
        .pageInner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 20px;
            padding: 50px;
            min-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        .pageInner.typeWarning {
            border: 3px solid #F05E5E;
        }
        
        .topBox {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .topBox img {
            width: 48px;
            height: 48px;
            margin-right: 15px;
        }
        
        .topBox h2 {
            font-size: 32px;
            color: #F05E5E;
            font-weight: bold;
        }
        
        .middleBox {
            font-size: 24px;
            color: #2C365C;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <!-- 헤더 -->
    <div class="header">
        <h1>🏭 SOFT 공장</h1>
        <div class="time" id="currentTime"></div>
    </div>
    
    <!-- 메인 -->
    <div class="mainList">
        
        <!-- 상단 4개 카드 -->
        <div class="topRow">
            
            <!-- 카드 1 -->
            <div class="gaugeItem" id="card1">
                <h2>[2F]냉장창고 도어1 온도</h2>
                <div class="chartGauge">
                    <svg width="160" height="160" viewBox="0 0 160 160">
                        <circle cx="80" cy="80" r="70" fill="none" stroke="#E5E7EB" stroke-width="20"/>
                        <circle cx="80" cy="80" r="70" fill="none" stroke="#60CB2E" stroke-width="20"
                                stroke-dasharray="440" stroke-dashoffset="220" transform="rotate(-90 80 80)"/>
                    </svg>
                </div>
                <div class="tempUnit">°C</div>
                <div class="chartLine">
                    <div class="yAxis">
                        <span>1.0</span>
                        <span>0.5</span>
                        <span>0</span>
                    </div>
                </div>
            </div>
            
            <!-- 카드 2 -->
            <div class="gaugeItem" id="card2">
                <h2>[2F]냉장창고 도어2 온도</h2>
                <div class="chartGauge">
                    <svg width="160" height="160" viewBox="0 0 160 160">
                        <circle cx="80" cy="80" r="70" fill="none" stroke="#E5E7EB" stroke-width="20"/>
                        <circle cx="80" cy="80" r="70" fill="none" stroke="#60CB2E" stroke-width="20"
                                stroke-dasharray="440" stroke-dashoffset="220" transform="rotate(-90 80 80)"/>
                    </svg>
                </div>
                <div class="tempUnit">°C</div>
                <div class="chartLine">
                    <div class="yAxis">
                        <span>1.0</span>
                        <span>0.5</span>
                        <span>0</span>
                    </div>
                </div>
            </div>
            
            <!-- 카드 3 (경고) -->
            <div class="gaugeItem ingWarning" id="card3">
                <h2>[2F]냉장창고 도어3 온도</h2>
                <div class="chartGauge">
                    <svg width="160" height="160" viewBox="0 0 160 160">
                        <circle cx="80" cy="80" r="70" fill="none" stroke="#E5E7EB" stroke-width="20"/>
                        <circle cx="80" cy="80" r="70" fill="none" stroke="#F05E5E" stroke-width="20"
                                stroke-dasharray="440" stroke-dashoffset="110" transform="rotate(-90 80 80)"/>
                    </svg>
                </div>
                <div class="tempUnit">°C</div>
                <div class="chartLine">
                    <div class="yAxis">
                        <span>1.0</span>
                        <span>0.5</span>
                        <span>0</span>
                    </div>
                </div>
            </div>
            
            <!-- 카드 4 -->
            <div class="gaugeItem" id="card4">
                <h2>[2F]냉장창고 도어4 온도</h2>
                <div class="chartGauge">
                    <svg width="160" height="160" viewBox="0 0 160 160">
                        <circle cx="80" cy="80" r="70" fill="none" stroke="#E5E7EB" stroke-width="20"/>
                        <circle cx="80" cy="80" r="70" fill="none" stroke="#60CB2E" stroke-width="20"
                                stroke-dasharray="440" stroke-dashoffset="220" transform="rotate(-90 80 80)"/>
                    </svg>
                </div>
                <div class="tempUnit">°C</div>
                <div class="chartLine">
                    <div class="yAxis">
                        <span>1.0</span>
                        <span>0.5</span>
                        <span>0</span>
                    </div>
                </div>
            </div>
            
        </div>
        
        <!-- 하단 2개 카드 -->
        <div class="bottomRow">
            
            <!-- 카드 5 -->
            <div class="gaugeItem" id="card5">
                <h2>[3F]냉동창고 도어1 온도</h2>
                <div class="chartGauge">
                    <svg width="160" height="160" viewBox="0 0 160 160">
                        <circle cx="80" cy="80" r="70" fill="none" stroke="#E5E7EB" stroke-width="20"/>
                        <circle cx="80" cy="80" r="70" fill="none" stroke="#60CB2E" stroke-width="20"
                                stroke-dasharray="440" stroke-dashoffset="220" transform="rotate(-90 80 80)"/>
                    </svg>
                </div>
                <div class="tempUnit">°C</div>
                <div class="chartLine">
                    <div class="yAxis">
                        <span>1.0</span>
                        <span>0.5</span>
                        <span>0</span>
                    </div>
                </div>
                <div class="doorBar">
                    <span class="doorText left">DOOR</span>
                    <div class="doorIndicator"></div>
                    <span class="doorText right">CLOSE</span>
                </div>
            </div>
            
            <!-- 카드 6 -->
            <div class="gaugeItem" id="card6">
                <h2>[3F]냉동창고 도어2 온도</h2>
                <div class="chartGauge">
                    <svg width="160" height="160" viewBox="0 0 160 160">
                        <circle cx="80" cy="80" r="70" fill="none" stroke="#E5E7EB" stroke-width="20"/>
                        <circle cx="80" cy="80" r="70" fill="none" stroke="#60CB2E" stroke-width="20"
                                stroke-dasharray="440" stroke-dashoffset="220" transform="rotate(-90 80 80)"/>
                    </svg>
                </div>
                <div class="tempUnit">°C</div>
                <div class="chartLine">
                    <div class="yAxis">
                        <span>1.0</span>
                        <span>0.5</span>
                        <span>0</span>
                    </div>
                </div>
                <div class="doorBar">
                    <span class="doorText left">DOOR</span>
                    <div class="doorIndicator"></div>
                    <span class="doorText right">CLOSE</span>
                </div>
            </div>
            
        </div>
        
    </div>
    
    <!-- 경고 팝업 -->
    <div class="pageLayer" id="warningLayer">
        <div class="pageMask"></div>
        <div class="pageInner typeWarning">
            <div class="topBox">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23F05E5E'%3E%3Cpath d='M12 2L1 21h22L12 2zm0 3.5L19.5 19h-15L12 5.5zM11 10v4h2v-4h-2zm0 6v2h2v-2h-2z'/%3E%3C/svg%3E" alt="경고">
                <h2>온도 한계 초과 경고</h2>
            </div>
            <div class="middleBox">
                [2F]냉장창고 도어3의 온도가<br>
                설정 한계값을 초과했습니다.
            </div>
        </div>
    </div>
    
    <script>
        // 시계
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('ko-KR', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            const dateStr = now.toLocaleDateString('ko-KR', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                weekday: 'short'
            });
            document.getElementById('currentTime').textContent = `${dateStr} ${timeStr}`;
        }
        updateTime();
        setInterval(updateTime, 1000);
        
        // 경고 팝업 자동 표시 (5초 후)
        setTimeout(() => {
            document.getElementById('warningLayer').classList.add('active');
            
            // 10초 후 자동 닫기
            setTimeout(() => {
                document.getElementById('warningLayer').classList.remove('active');
            }, 10000);
        }, 5000);
        
        // 팝업 클릭시 닫기
        document.querySelector('.pageMask')?.addEventListener('click', () => {
            document.getElementById('warningLayer').classList.remove('active');
        });
    </script>
</body>
</html>
