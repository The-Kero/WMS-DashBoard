<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재고조사 기록 — 냉장파트 DX</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/records.css') }}">
</head>
<body>

<div class="top-bar">
    <h1>재고조사 기록</h1>
    <div class="controls">
        <label for="month-select">월</label>
        <select id="month-select"></select>
        <label for="part-select">부서</label>
        <select id="part-select">
            <option value="냉장">냉장</option>
            <option value="냉동">냉동</option>
            <option value="상온">상온</option>
        </select>
        <button id="refresh-btn" class="primary">🔄 새로고침</button>
        <button id="csv-btn">💾 CSV</button>
        <button id="print-btn">🖨️ 인쇄</button>
    </div>
</div>

<!-- ★ 222차 #45: 상품 검색 바 (태블릿 SearchDialog와 동일 톤) -->
<div class="search-bar">
    <span class="search-icon">🔍</span>
    <div class="search-input-wrap">
        <input type="text" id="product-search" placeholder="상품명 2글자 이상 입력 (재고조사 이력 조회)" autocomplete="off">
        <div id="search-dropdown" class="search-dropdown" style="display:none"></div>
    </div>
    <button id="search-clear" class="search-clear" style="display:none">✕</button>
</div>

<div class="summary">
    <span class="badge">차이 기록 상품 <b id="sum-items">–</b>건</span>
    <span class="badge">차이값 셀 <b id="sum-cells">–</b>건</span>
    <span class="badge">특이사항 <b id="sum-text">–</b>건</span>
    <span class="badge">마감일 <b id="sum-month">–</b></span>
</div>

<div class="matrix-container">
    <div id="loading" class="loading">⏳ 불러오는 중...</div>
    <table id="matrix-table" style="display:none;">
        <thead>
            <tr id="thead-row"></tr>
        </thead>
        <tbody id="matrix-body"></tbody>
    </table>
    <div id="empty" class="empty-state" style="display:none;">
        <span class="emoji">📋</span>
        해당 월에 차이 기록이 없어요.<br>
        <small style="color:#90A4AE;">재고조사 시 차이가 발견된 항목만 기록됩니다.</small>
    </div>
</div>

<!-- ★ 222차 #45: 상품별 재고조사 이력 섹션 (상품 선택 시에만 표시) -->
<div id="product-history-section" class="product-history-section" style="display:none">
    <div class="product-info-card">
        <div class="product-info-left">
            <h2 class="product-name" id="ph-name">–</h2>
            <div class="product-meta">
                <span id="ph-skukey">–</span>
                <span class="dot">·</span>
                <span id="ph-spec">–</span>
                <span class="dot">·</span>
                <span>기본 <b id="ph-stockloc">–</b></span>
            </div>
        </div>
        <button id="ph-close" class="ph-close" title="닫기">✕</button>
    </div>

    <div class="period-toggle" id="period-toggle">
        <!-- JS로 버튼 동적 생성 (PERIOD_PRESETS 배열 기반) -->
    </div>

    <div class="history-table-wrap">
        <div id="ph-loading" class="ph-loading" style="display:none">⏳ 조회 중...</div>
        <div id="ph-empty" class="ph-empty" style="display:none">
            <span class="emoji">📋</span>
            해당 기간에 재고조사 기록이 없어요.
        </div>
        <table id="ph-table" class="history-table" style="display:none">
            <thead>
                <tr>
                    <th>날짜</th>
                    <th>시간</th>
                    <th>로케</th>
                    <th>소비기한</th>
                    <th>Action</th>
                    <th>작업자</th>
                    <th>가용수량</th>
                    <th>실사수량</th>
                    <th>차이</th>
                    <th>비고 / 사유 / 상태</th>
                </tr>
            </thead>
            <tbody id="ph-tbody"></tbody>
        </table>
    </div>
</div>

<!-- 셀 클릭 상세 모달 -->
<div id="detail-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <div>
                <h2 id="modal-title">–</h2>
                <span id="modal-subtitle" class="subtitle">–</span>
            </div>
            <button class="modal-close" id="modal-close">×</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
    </div>
</div>

<!-- ★ 216차 #26: 날짜 헤더 클릭 → 인쇄 필터 선택 모달 -->
<div id="print-modal" class="modal print-modal">
    <div class="modal-content print-modal-content">
        <div class="modal-header">
            <div>
                <h2 id="print-modal-title">📋 재고장 인쇄</h2>
                <span id="print-modal-subtitle" class="subtitle">–</span>
            </div>
            <button class="modal-close" id="print-modal-close">×</button>
        </div>
        <div class="print-options" id="print-options"></div>
    </div>
</div>

<script>
// ============================================================
// 재고조사 기록 — JavaScript (210차 #16)
// ============================================================

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

const monthSelect = $('#month-select');
const partSelect = $('#part-select');
const refreshBtn = $('#refresh-btn');
const csvBtn = $('#csv-btn');
const printBtn = $('#print-btn');
const loading = $('#loading');
const table = $('#matrix-table');
const theadRow = $('#thead-row');
const matrixBody = $('#matrix-body');
const empty = $('#empty');
const modal = $('#detail-modal');
const modalTitle = $('#modal-title');
const modalSubtitle = $('#modal-subtitle');
const modalBody = $('#modal-body');

// ★ 216차 #26: 인쇄 필터 선택 모달
const printModal = $('#print-modal');
const printModalSubtitle = $('#print-modal-subtitle');
const printOptionsContainer = $('#print-options');

// ★ 216차 #26: 인쇄 필터 정의 (미래 확장 시 객체 1개 추가로 버튼 자동 생성)
// 6원칙: ①OPS톤 색상 체계(매트릭스와 통일) ③정합성(태블릿 용어) ④확장성(버튼 자동 생성)
const PRINT_FILTERS = [
    {
        key: 'all',
        icon: '🗂',
        label: '전체 재고장',
        desc: '차이+체크 모두 · 아워홈 제출용',
        color: '#1976D2',   // CBlue — 매트릭스 헤더 색
        bgFrom: '#E3F2FD', bgTo: '#BBDEFB',
    },
    {
        key: 'diff',
        icon: '⚠',
        label: '차이만 인쇄',
        desc: '미해결 차이만 · 원인 추적용',
        color: '#C62828',   // CRed — 매트릭스 cell-diff-neg
        bgFrom: '#FFEBEE', bgTo: '#FFCDD2',
    },
    {
        key: 'caution',
        icon: '🌿',
        label: '신선&부진만',
        desc: '유통비 낮은 상품 · 부진재고 관리용',
        color: '#E65100',   // Orange — 매트릭스 cell-text
        bgFrom: '#FFF3E0', bgTo: '#FFE0B2',
    },
];

let currentData = null;

// ───── 월 옵션 생성 (현재 포함 과거 12개월) ─────
function initMonths() {
    const now = new Date();
    for (let i = 0; i < 12; i++) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        const opt = document.createElement('option');
        opt.value = ym;
        opt.textContent = ym;
        monthSelect.appendChild(opt);
    }
}

// ───── 요일 판정 (헤더 주말 강조용) ─────
function weekdayOf(year, month, day) {
    return new Date(year, month - 1, day).getDay();  // 0=일, 6=토
}

// ───── 헤더 렌더링 ─────
function renderHead(year, month, lastDay) {
    theadRow.innerHTML = `
        <th class="sticky-col col-locaky">로케</th>
        <th class="sticky-col col-skukey">상품코드</th>
        <th class="sticky-col col-name">상품명</th>
        <th class="sticky-col col-spec">규격</th>
    `;
    for (let d = 1; d <= lastDay; d++) {
        const w = weekdayOf(year, month, d);
        const cls = w === 0 ? 'weekend' : (w === 6 ? 'saturday' : '');
        const dateStr = `${year}${String(month).padStart(2,'0')}${String(d).padStart(2,'0')}`;
        theadRow.innerHTML += `<th class="day-col printable ${cls}" data-date="${dateStr}" title="클릭: 이 날짜 재고장 인쇄 (전체/차이/신선&부진 선택)">${d}</th>`;
    }
}

// ───── 날짜 헤더 클릭 → 태블릿 양식 PDF 미리보기 (211차 #24 / 216차 #26 모달 분기) ─────
// 6원칙 ⑤안정성: R2 팝업차단 감지 + R5 0건 안내 + R6 중복클릭 방지
async function printDay(dateStr, filter='diff') {
    // ★ filter 라벨 (안내 메시지용)
    const filterDef = PRINT_FILTERS.find(f => f.key === filter);
    const filterLabel = filterDef ? filterDef.label : filter;

    try {
        const res = await fetch('/api/records/print', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                center: 'WH15',
                part: partSelect.value,
                date: dateStr,
                filter: filter
            })
        });
        if (!res.ok) {
            const t = await res.text();
            alert(`인쇄 실패 ${res.status}: ${t.slice(0, 200)}`);
            return;
        }

        // ★ R5 대응: 응답이 JSON(WARN)인지 PDF인지 Content-Type으로 판정
        const ct = res.headers.get('Content-Type') || '';
        if (ct.includes('application/json')) {
            const data = await res.json();
            alert(`⚠ "${filterLabel}" 조건의 인쇄할 데이터가 없어요.\n\n${data.detail || ''}`);
            return;
        }

        const blob = await res.blob();
        if (!blob.size) {
            alert(`⚠ "${filterLabel}" 조건의 인쇄 데이터가 비어있어요.`);
            return;
        }

        const url = URL.createObjectURL(blob);
        // ★ R2 대응: 팝업 차단기 감지
        const newWin = window.open(url, '_blank');
        if (!newWin || newWin.closed || typeof newWin.closed === 'undefined') {
            URL.revokeObjectURL(url);
            alert('❌ 팝업이 차단됐어요!\n\n브라우저 주소창 옆 팝업 차단 아이콘을 눌러서 "허용"으로 바꾸신 후 다시 시도해주세요.');
            return;
        }
        setTimeout(() => URL.revokeObjectURL(url), 30000);
    } catch (e) {
        alert(`인쇄 요청 실패: ${e.message}`);
    }
}

// ★ 216차 #26: 날짜 헤더 클릭 → 인쇄 필터 선택 모달 열기
function openPrintModal(dateStr) {
    // dateStr = "YYYYMMDD" → "M월 D일 (요일)" 변환
    const y = parseInt(dateStr.slice(0, 4));
    const m = parseInt(dateStr.slice(4, 6));
    const d = parseInt(dateStr.slice(6, 8));
    const weekdayKor = ['일', '월', '화', '수', '목', '금', '토'];
    const w = weekdayKor[new Date(y, m - 1, d).getDay()];
    printModalSubtitle.textContent = `${m}월 ${d}일 (${w})`;

    // 필터 버튼 동적 생성 (PRINT_FILTERS 배열 기반 — 기초공사: 확장 시 배열만 수정)
    printOptionsContainer.innerHTML = '';
    PRINT_FILTERS.forEach(f => {
        const btn = document.createElement('button');
        btn.className = 'print-option';
        btn.style.setProperty('--opt-color', f.color);
        btn.style.setProperty('--opt-bg-from', f.bgFrom);
        btn.style.setProperty('--opt-bg-to', f.bgTo);
        btn.innerHTML = `
            <span class="option-icon">${f.icon}</span>
            <span class="option-text">
                <b>${f.label}</b>
                <small>${f.desc}</small>
            </span>
        `;
        btn.addEventListener('click', () => {
            // ★ R6 대응: 옵션 클릭 즉시 모달 닫음 (중복 클릭 방지)
            printModal.classList.remove('visible');
            printDay(dateStr, f.key);
        });
        printOptionsContainer.appendChild(btn);
    });

    printModal.classList.add('visible');
}

// ───── 매트릭스 본문 렌더링 ─────
function renderBody(items, year, month, lastDay) {
    matrixBody.innerHTML = '';
    let cellCount = 0;
    let textCount = 0;

    items.forEach(item => {
        const tr = document.createElement('tr');
        const lotaBadge = item.lota13
            ? `<span style="font-size:10px;color:#90A4AE;">·${item.lota13.slice(2)}</span>` : '';
        tr.innerHTML = `
            <td class="sticky-col col-locaky">${item.locaky}</td>
            <td class="sticky-col col-skukey">${item.skukey}</td>
            <td class="sticky-col col-name">${escapeHtml(item.product_name || '–')}${lotaBadge}</td>
            <td class="sticky-col col-spec">${escapeHtml(item.spec || '')}</td>
        `;
        for (let d = 1; d <= lastDay; d++) {
            const td = document.createElement('td');
            td.className = 'day-cell';
            const rec = item.days[d];
            if (rec) {
                cellCount++;
                const diff = rec.diff;

                // ★ 216차 #26-B: 색상 체계 단순화 — 빨강(-)/파랑(+)만. 주황(비고)/초록(0) 제거.
                // 차이값 색상 결정
                let diffText = '';
                if (diff < 0) {
                    td.classList.add('cell-diff-neg');
                    diffText = String(diff);
                    td.title = `${diff}개 부족 | ${rec.worker || '–'}`;
                } else if (diff > 0) {
                    td.classList.add('cell-diff-pos');
                    diffText = '+' + diff;
                    td.title = `${diff}개 잉여 | ${rec.worker || '–'}`;
                } else {
                    // 차이 0 — 무색 배경 + "0" 텍스트 (빈 셀과 구분)
                    diffText = '0';
                    td.title = `정물일치 | ${rec.worker || '–'}`;
                }

                // ★ 216차 #26-B: 비고 있으면 세로 2줄 배치 (차이 위, 비고 아래).
                // 비고 없으면 1줄 유지 (조건부 2줄).
                if (rec.note) {
                    textCount++;
                    td.classList.add('cell-has-note');
                    // title에 비고+차이 full 정보 포함 (hover 시 상세 확인)
                    td.title = `${rec.note}\n차이: ${diff >= 0 ? '+' + diff : diff}\n작업자: ${rec.worker || '–'}`;
                    // innerHTML 사용 — escapeHtml 필수 (XSS 방지, R1 대응)
                    td.innerHTML = `<span class="cell-diff-val">${diffText}</span><span class="cell-note-text">${escapeHtml(truncate(rec.note, 6))}</span>`;
                } else {
                    td.textContent = diffText;  // 1줄 (기존 동작 유지)
                }

                const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                td.onclick = () => openDetail(item, dateStr);
            }
            tr.appendChild(td);
        }
        matrixBody.appendChild(tr);
    });

    $('#sum-items').textContent = items.length;
    $('#sum-cells').textContent = cellCount;
    $('#sum-text').textContent = textCount;
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
}
function truncate(s, n) {
    s = String(s);
    return s.length > n ? s.slice(0, n) + '…' : s;
}

// ───── 매트릭스 로드 ─────
async function loadMatrix() {
    const month = monthSelect.value;
    const part = partSelect.value;
    $('#sum-month').textContent = month;
    loading.style.display = 'block';
    table.style.display = 'none';
    empty.style.display = 'none';

    try {
        const res = await fetch(`/api/records/matrix?month=${month}&part=${encodeURIComponent(part)}`);
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'API 실패');
        currentData = data;
        const [y, m] = month.split('-').map(Number);
        renderHead(y, m, data.last_day);
        if (data.items.length === 0) {
            loading.style.display = 'none';
            empty.style.display = 'block';
            $('#sum-items').textContent = 0;
            $('#sum-cells').textContent = 0;
            $('#sum-text').textContent = 0;
        } else {
            renderBody(data.items, y, m, data.last_day);
            loading.style.display = 'none';
            table.style.display = '';
        }
    } catch (e) {
        loading.innerHTML = `❌ 에러: ${e.message}`;
        console.error(e);
    }
}

// ───── 셀 상세 모달 ─────
async function openDetail(item, date) {
    modalTitle.textContent = `${item.product_name || item.skukey}`;
    modalSubtitle.textContent = `${item.locaky} · ${item.skukey}${item.lota13 ? ' · 소비기한 ' + item.lota13 : ''} · ${date}`;
    modalBody.innerHTML = '<div class="loading">⏳ 이력 조회 중...</div>';
    modal.classList.add('visible');

    try {
        const params = new URLSearchParams({
            locaky: item.locaky,
            skukey: item.skukey,
            lota13: item.lota13 || '',
            date: date,
            part: partSelect.value,
        });
        const res = await fetch(`/api/records/detail?${params}`);
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'API 실패');
        renderEvents(data.events);
    } catch (e) {
        modalBody.innerHTML = `<div class="empty-state">❌ ${e.message}</div>`;
    }
}

function renderEvents(events) {
    if (!events || events.length === 0) {
        modalBody.innerHTML = '<div class="empty-state">해당 날짜에 기록이 없어요.</div>';
        return;
    }
    modalBody.innerHTML = events.map(e => {
        const diffCls = e.diff < 0 ? 'neg' : (e.diff > 0 ? 'pos' : 'zero');
        const diffStr = e.diff >= 0 ? '+' + e.diff : e.diff;
        const resolvedPill = e.resolved
            ? '<span class="pill resolved">해결</span>'
            : '<span class="pill unresolved">미해결</span>';
        const actionLabel = {
            'diff': '차이', 'check': '확인', 'cancel': '취소', 'unlock': '풀림'
        }[e.action] || e.action;
        return `
            <div class="event-card action-${e.action}">
                <div class="event-head">
                    <span class="event-time">${e.time}</span>
                    <span class="event-action action-${e.action}">${actionLabel}</span>
                    <span class="event-worker">${escapeHtml(e.worker)}</span>
                </div>
                ${e.action === 'diff' ? `
                <div class="event-qty">
                    가용 ${e.system_qty} → 실제 ${e.actual_qty}
                    <span class="diff ${diffCls}">(${diffStr})</span>
                </div>
                ` : ''}
                ${e.note ? `<div class="event-extra"><span class="label">비고:</span>${escapeHtml(e.note)}</div>` : ''}
                ${e.reason ? `<div class="event-extra"><span class="label">사유:</span>${escapeHtml(e.reason)}</div>` : ''}
                ${e.action === 'diff' ? `<div class="event-extra"><span class="label">상태:</span>${resolvedPill}</div>` : ''}
            </div>
        `;
    }).join('');
}

// ───── CSV 다운로드 ─────
function downloadCSV() {
    if (!currentData) return;
    const { items, month, last_day } = currentData;
    const headers = ['로케', '상품코드', '상품명', '규격'];
    for (let d = 1; d <= last_day; d++) headers.push(d + '일');
    const rows = [headers.join(',')];
    items.forEach(it => {
        const row = [
            it.locaky, it.skukey,
            `"${(it.product_name || '').replace(/"/g, '""')}"`,
            `"${(it.spec || '').replace(/"/g, '""')}"`
        ];
        for (let d = 1; d <= last_day; d++) {
            const rec = it.days[d];
            if (!rec) { row.push(''); continue; }
            if (rec.note) row.push(`"${rec.note.replace(/"/g, '""')}"`);
            else row.push(rec.diff);
        }
        rows.push(row.join(','));
    });
    const csv = '\uFEFF' + rows.join('\n');  // BOM for Excel Korean
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `재고조사기록_${month}.csv`;
    a.click();
    URL.revokeObjectURL(url);
}

// ───── 이벤트 ─────
$('#modal-close').onclick = () => modal.classList.remove('visible');
modal.onclick = e => { if (e.target === modal) modal.classList.remove('visible'); };

// ★ 216차 #26: 인쇄 필터 선택 모달 닫기 (ESC / 바깥 클릭 / × 버튼)
$('#print-modal-close').onclick = () => printModal.classList.remove('visible');
printModal.onclick = e => { if (e.target === printModal) printModal.classList.remove('visible'); };

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        modal.classList.remove('visible');
        printModal.classList.remove('visible');  // ★ 216차 #26
    }
});

monthSelect.onchange = loadMatrix;
partSelect.onchange = loadMatrix;
refreshBtn.onclick = loadMatrix;
csvBtn.onclick = downloadCSV;
printBtn.onclick = () => window.print();  // 매트릭스 월별 전체 인쇄 (브라우저 기본)

// ★ 211차 → 216차 #26: 날짜 헤더 클릭 → 인쇄 필터 선택 모달 (이벤트 위임)
theadRow.addEventListener('click', (e) => {
    const th = e.target.closest('th.printable');
    if (!th || !th.dataset.date) return;
    openPrintModal(th.dataset.date);  // ★ 216차: 'diff' 하드코딩 → 모달 분기
});

// ============================================================
// ★ 222차 #45: 상품 검색 + 상품별 이력 (태블릿 SearchDialog 미러링)
// ============================================================

const PERIOD_PRESETS = [
    { days: 7,  label: '7일' },
    { days: 14, label: '14일' },
    { days: 30, label: '30일' },
    { days: 90, label: '90일' },
];

const ACTION_LABELS = {
    'check':    { txt: '✓ 확인', cls: 'act-check' },
    'diff':     { txt: '⚠ 차이', cls: 'act-diff' },
    'cancel':   { txt: '↶ 취소', cls: 'act-cancel' },
    'unlock':   { txt: '🔓 풀림', cls: 'act-unlock' },
    'add_item': { txt: '+ 추가', cls: 'act-add' },
};

const searchInput = $('#product-search');
const searchDropdown = $('#search-dropdown');
const searchClear = $('#search-clear');
const phSection = $('#product-history-section');
const phName = $('#ph-name');
const phSkukey = $('#ph-skukey');
const phSpec = $('#ph-spec');
const phStockloc = $('#ph-stockloc');
const phLoading = $('#ph-loading');
const phEmpty = $('#ph-empty');
const phTable = $('#ph-table');
const phTbody = $('#ph-tbody');
const periodToggle = $('#period-toggle');

let selectedSkukey = '';
let selectedDays = 7;
let searchTimer = null;

// ───── 기간 토글 버튼 생성 ─────
function initPeriodToggle() {
    periodToggle.innerHTML = '';
    PERIOD_PRESETS.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'period-btn';
        btn.dataset.days = p.days;
        btn.textContent = p.label;
        if (p.days === selectedDays) btn.classList.add('active');
        btn.addEventListener('click', () => {
            selectedDays = p.days;
            $$('#period-toggle .period-btn').forEach(b => b.classList.toggle('active', Number(b.dataset.days) === selectedDays));
            if (selectedSkukey) loadHistory();
        });
        periodToggle.appendChild(btn);
    });
}

// ───── 상품 검색 (debounce 300ms) ─────
searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim();
    searchClear.style.display = q ? '' : 'none';
    clearTimeout(searchTimer);
    if (q.length < 2) { searchDropdown.style.display = 'none'; return; }
    searchTimer = setTimeout(() => doSearchProduct(q), 300);
});

async function doSearchProduct(q) {
    try {
        const res = await fetch(`/api/records/search-product?q=${encodeURIComponent(q)}&part=${encodeURIComponent(partSelect.value)}`);
        const data = await res.json();
        if (!data.success) { searchDropdown.style.display = 'none'; return; }
        renderDropdown(data.products || []);
    } catch (e) {
        searchDropdown.style.display = 'none';
    }
}

function renderDropdown(products) {
    if (!products.length) {
        searchDropdown.innerHTML = '<div class="dropdown-empty">결과 없음</div>';
        searchDropdown.style.display = '';
        return;
    }
    searchDropdown.innerHTML = products.map(p => `
        <div class="dropdown-item" data-skukey="${p.product_code}" data-name="${escapeHtml(p.product_name || '')}" data-spec="${escapeHtml(p.spec || '')}" data-stockloc="${escapeHtml(p.stock_location || '')}">
            <div class="dd-name">${escapeHtml(p.product_name || '')}</div>
            <div class="dd-meta">
                <span class="dd-code">${p.product_code}</span>
                ${p.spec ? `<span class="dd-spec">${escapeHtml(p.spec)}</span>` : ''}
                ${p.stock_location ? `<span class="dd-stockloc">기본 ${escapeHtml(p.stock_location)}</span>` : ''}
            </div>
        </div>
    `).join('');
    searchDropdown.style.display = '';
    $$('#search-dropdown .dropdown-item').forEach(el => {
        el.addEventListener('click', () => {
            selectProduct({
                product_code: el.dataset.skukey,
                product_name: el.dataset.name,
                spec: el.dataset.spec,
                stock_location: el.dataset.stockloc,
            });
        });
    });
}

function selectProduct(p) {
    selectedSkukey = p.product_code;
    phName.textContent = p.product_name || '–';
    phSkukey.textContent = p.product_code;
    phSpec.textContent = p.spec || '–';
    phStockloc.textContent = p.stock_location || '–';
    searchInput.value = '';
    searchDropdown.style.display = 'none';
    searchClear.style.display = 'none';
    phSection.style.display = '';
    selectedDays = 7;
    $$('#period-toggle .period-btn').forEach(b => b.classList.toggle('active', Number(b.dataset.days) === 7));
    loadHistory();
    // 섹션으로 스크롤
    setTimeout(() => phSection.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80);
}

// ───── 검색 클리어 ─────
searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchDropdown.style.display = 'none';
    searchClear.style.display = 'none';
    searchInput.focus();
});

// ───── 드롭다운 외부 클릭 닫기 ─────
document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-bar')) searchDropdown.style.display = 'none';
});

// ───── 상품 이력 섹션 닫기 ─────
$('#ph-close').addEventListener('click', () => {
    phSection.style.display = 'none';
    selectedSkukey = '';
});

// ───── 이력 로드 ─────
async function loadHistory() {
    if (!selectedSkukey) return;
    phLoading.style.display = '';
    phEmpty.style.display = 'none';
    phTable.style.display = 'none';

    try {
        const res = await fetch(`/api/records/product-history?skukey=${encodeURIComponent(selectedSkukey)}&days=${selectedDays}&part=${encodeURIComponent(partSelect.value)}`);
        const data = await res.json();
        phLoading.style.display = 'none';
        if (!data.success) {
            phEmpty.style.display = '';
            phEmpty.textContent = '조회 실패: ' + (data.error || '알 수 없는 오류');
            return;
        }
        const events = data.events || [];
        if (!events.length) {
            phEmpty.style.display = '';
            phEmpty.innerHTML = '<span class="emoji">📋</span> 최근 ' + selectedDays + '일 재고조사 기록이 없어요.';
            return;
        }
        renderHistoryTable(events);
        phTable.style.display = '';
    } catch (e) {
        phLoading.style.display = 'none';
        phEmpty.style.display = '';
        phEmpty.textContent = '오류: ' + e.message;
    }
}

function renderHistoryTable(events) {
    phTbody.innerHTML = events.map(ev => {
        const actDef = ACTION_LABELS[ev.action] || { txt: ev.action, cls: '' };
        const diffCls = ev.diff < 0 ? 'diff-neg' : (ev.diff > 0 ? 'diff-pos' : 'diff-zero');
        const diffStr = ev.action === 'diff' ? (ev.diff >= 0 ? '+' + ev.diff : String(ev.diff)) : '';
        const lota13Fmt = ev.lota13 && ev.lota13.length === 8
            ? `${ev.lota13.slice(2,4)}.${ev.lota13.slice(4,6)}.${ev.lota13.slice(6,8)}` : (ev.lota13 || '–');
        const qtyStr = ev.action === 'diff' ? `<span class="qty-sys">${ev.system_qty}</span>` : (ev.system_qty ? String(ev.system_qty) : '–');
        const actStr = ev.action === 'diff' ? `<span class="qty-act">${ev.actual_qty}</span>` : (ev.actual_qty ? String(ev.actual_qty) : '–');

        // 비고/사유/상태 조합 (2줄 구조 — 핵심 1줄 + 서브 1줄)
        const extras = [];
        if (ev.note) extras.push(`<span class="ex-note">비고: ${escapeHtml(ev.note)}</span>`);
        if (ev.reason) extras.push(`<span class="ex-reason">사유: ${escapeHtml(ev.reason)}</span>`);
        if (ev.action === 'diff') {
            extras.push(ev.resolved
                ? '<span class="ex-resolved ok">해결</span>'
                : '<span class="ex-resolved ng">미해결</span>');
        }
        if (ev.is_added) extras.push('<span class="ex-added">+ 항목추가</span>');
        const extraStr = extras.length ? extras.join(' ') : '<span class="ex-empty">–</span>';

        return `
            <tr class="history-row ${actDef.cls}">
                <td class="h-date">${ev.check_date}</td>
                <td class="h-time">${ev.time}</td>
                <td class="h-loc">${ev.locaky}</td>
                <td class="h-lota">${lota13Fmt}</td>
                <td class="h-action"><span class="action-badge ${actDef.cls}">${actDef.txt}</span></td>
                <td class="h-worker">${escapeHtml(ev.worker) || '–'}</td>
                <td class="h-sys">${qtyStr}</td>
                <td class="h-act">${actStr}</td>
                <td class="h-diff ${diffCls}">${diffStr || '–'}</td>
                <td class="h-extra">${extraStr}</td>
            </tr>
        `;
    }).join('');
}

// ───── 초기화 ─────
initMonths();
loadMatrix();
initPeriodToggle();
</script>
